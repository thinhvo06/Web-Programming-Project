<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteApp - Ứng dụng Quản lý Ghi chú</title>
    <meta name="description" content="Ứng dụng quản lý ghi chú trực quan, hỗ trợ tự động lưu, gắn nhãn, phân quyền chia sẻ và hoạt động ngoại tuyến." />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Web App Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-blue-100 selection:text-blue-900 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[PWA] Service Worker registered successfully:', reg.scope);
            })
            .catch(err => {
              console.log('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
