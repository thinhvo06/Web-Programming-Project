version: '3.8'

services:
  # 1. MySQL Database Service (Port 3306)
  mysql_db:
    image: mysql:8.0
    container_name: tdtu_note_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tdtu_note_app
      MYSQL_USER: tdtu_user
      MYSQL_PASSWORD: tdtu_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend-php/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend PHP RESTful API Service (Port 8000)
  backend_php:
    build:
      context: ./backend-php
      dockerfile: Dockerfile
    container_name: tdtu_note_backend_php
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: tdtu_note_app
      DB_USER: tdtu_user
      DB_PASS: tdtu_password
    ports:
      - "8000:80"
    volumes:
      - ./backend-php:/var/www/html

volumes:
  mysql_data:
