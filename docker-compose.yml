version: '3.8'

services:
  # MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: tdtu_note_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tdtu_note_app
      MYSQL_USER: tdtu_user
      MYSQL_PASSWORD: tdtu_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend RESTful API & WebSocket Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tdtu_note_backend
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      BASE_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5173,http://localhost:3000
      JWT_SECRET: tdtu_web_programming_final_project_jwt_secret_key_2026
      JWT_EXPIRES_IN: 7d
      DB_DIALECT: mysql
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: tdtu_note_app
      DB_USER: tdtu_user
      DB_PASS: tdtu_password
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "TDTU Note App <noreply@tdtu.edu.vn>"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

volumes:
  mysql_data:
  backend_uploads:
